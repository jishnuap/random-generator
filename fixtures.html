<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0E3B2C">
  <title>Vadamvali Fixtures · Onaaravam ’26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600;700&family=Noto+Serif+Malayalam:wght@500;700&display=swap">
  <style>
    :root {
      --pine: #0E3B2C; --pine-deep: #082A1F; --pine-mid: #14503B; --pine-line: #1E5741;
      --ivory: #F7F2E2; --ivory-2: #EFE6CF; --card: #FFFDF6; --ink: #17271F; --muted: #47594E;
      --gold: #C9963F; --gold-l: #E4C173; --clay: #9A4E22; --clay-l: #C4703C; --line: #DCD2B6;
      --on-dark: #F0EADA; --on-dark-2: #C2D2C6;
      --win: #1F6B45; --win-bg: #E3EFE3; --warn-bg: #F8E6D6;
      --disp: 'Marcellus', 'Palatino Linotype', Palatino, Georgia, serif;
      --body: 'Karla', 'Helvetica Neue', 'Segoe UI', sans-serif;
      --mal: 'Noto Serif Malayalam', Georgia, serif;
      --gutter: 16px;
      --tap: 48px;
    }
    @media (min-width: 640px) { :root { --gutter: 32px; } }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--ivory); color: var(--ink);
      font: 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    h1, h2, h3, p { margin: 0; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 var(--gutter); }

    /* Header */
    .top { background: var(--pine); color: var(--on-dark); padding: 18px 0 14px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-l); }
    .top h1 { font: 400 28px/1.15 var(--disp); margin: 8px 0 14px; }
    .top h1 .mal { font: 700 18px var(--mal); color: var(--on-dark-2); margin-left: 6px; }
    .seg { display: flex; background: var(--pine-deep); border-radius: 12px; padding: 4px; gap: 4px; }
    .seg button {
      flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent;
      color: var(--on-dark-2); font-weight: 700; font-size: 16px;
    }
    .seg button[aria-pressed="true"] { background: var(--gold-l); color: var(--pine-deep); }

    /* Section tabs: bottom bar on phones, sticky strip on desktop */
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
      background: var(--card); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -4px 16px rgba(8, 42, 31, .08);
    }
    .tabs button {
      flex: 1; min-height: 60px; border: 0; background: none; padding: 6px 2px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 12px; font-weight: 700; color: var(--muted);
    }
    .tabs svg { width: 22px; height: 22px; }
    .tabs button[aria-current="page"] { color: var(--pine); }
    .tabs button[aria-current="page"] svg { color: var(--clay); }
    main { padding-top: 20px; padding-bottom: 110px; }
    @media (min-width: 900px) {
      .tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line);
              box-shadow: none; justify-content: center; padding: 0 var(--gutter); }
      .tabs button { flex: 0 0 auto; flex-direction: row; gap: 8px; min-height: 56px; padding: 0 22px; font-size: 15px;
                     border-bottom: 3px solid transparent; }
      .tabs button[aria-current="page"] { border-bottom-color: var(--clay); }
      main { padding-bottom: 48px; }
    }

    /* Building blocks */
    h2.sec { font: 400 24px/1.2 var(--disp); color: var(--pine); margin-bottom: 4px; }
    .lede { color: var(--muted); margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card h3 { font-size: 17px; margin-bottom: 10px; }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .stack > * + * { margin-top: 10px; }
    .grid { display: grid; gap: 14px; }
    @media (min-width: 700px) { .grid.two { grid-template-columns: 1fr 1fr; } }

    .btn {
      min-height: var(--tap); padding: 0 18px; border-radius: 12px; border: 2px solid var(--pine);
      background: var(--card); color: var(--pine); font-weight: 700; font-size: 16px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
    }
    .btn.primary { background: var(--pine); color: var(--on-dark); }
    .btn.gold { background: var(--gold-l); border-color: var(--gold-l); color: var(--pine-deep); }
    .btn.danger { border-color: var(--clay); color: var(--clay); }
    .btn.block { width: 100%; }
    .btn:disabled, .seg-l button:disabled { opacity: .45; cursor: not-allowed; }
    .field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
    input[type="text"], input[type="number"], select, textarea {
      min-height: var(--tap); border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
      padding: 8px 12px; font-size: 17px; color: var(--ink); width: 100%;
    }
    textarea { min-height: 120px; resize: vertical; }
    input:disabled, select:disabled, textarea:disabled { background: var(--ivory-2); color: var(--muted); }
    .num { width: 92px !important; text-align: center; }

    .seg-l { display: flex; border: 1.5px solid var(--pine); border-radius: 12px; overflow: hidden; }
    .seg-l button { flex: 1; min-height: var(--tap); border: 0; background: var(--card); font-weight: 700; color: var(--pine); padding: 0 10px; }
    .seg-l button + button { border-left: 1.5px solid var(--pine); }
    .seg-l button[aria-pressed="true"] { background: var(--pine); color: var(--on-dark); }

    .note { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
    .note svg { width: 20px; height: 20px; margin-top: 1px; flex-shrink: 0; }
    .note.lock { background: var(--pine); color: var(--on-dark); }
    .note.warn { background: var(--warn-bg); color: #5C2C10; }
    .note.info { background: var(--ivory-2); }
    .err { color: var(--clay); font-weight: 600; font-size: 14px; }

    /* Teams */
    .team-row { display: flex; gap: 8px; align-items: center; }
    .team-row .idx { width: 26px; text-align: right; color: var(--muted); font-size: 14px; flex-shrink: 0; }
    .icon-btn {
      width: var(--tap); height: var(--tap); flex-shrink: 0; border-radius: 10px; border: 1.5px solid var(--line);
      background: var(--card); color: var(--clay); display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn svg { width: 20px; height: 20px; }
    details > summary { cursor: pointer; font-weight: 700; color: var(--pine); min-height: var(--tap); display: flex; align-items: center; }

    /* Groups */
    .seed { font: 400 22px var(--disp); color: var(--pine); letter-spacing: .04em; }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--ivory-2); color: var(--muted); }
    .tag.clay { background: var(--warn-bg); color: var(--clay); }
    .groups { display: grid; gap: 14px; }
    @media (min-width: 640px) { .groups { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } }
    .gcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; }
    .gcard.drop { border-color: var(--gold); background: #FFF8E6; }
    .gcard h3 { font: 400 22px var(--disp); color: var(--pine); display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .gcard h3 small { font: 600 14px var(--body); color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      min-height: var(--tap); min-width: 64px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--pine-line);
      background: #fff; font-weight: 700; font-size: 17px; color: var(--pine);
    }
    .chip[aria-pressed="true"] { background: var(--gold-l); border-color: var(--gold); }
    .chip:disabled { opacity: 1; cursor: default; border-color: var(--line); }
    .move-here { margin-top: 12px; }

    /* Matches */
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
    .filters button {
      flex-shrink: 0; min-height: 40px; padding: 0 16px; border-radius: 99px; border: 1.5px solid var(--line);
      background: var(--card); font-weight: 700; font-size: 15px; color: var(--muted);
    }
    .filters button[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--on-dark); }
    .mlist { display: grid; gap: 10px; }
    @media (min-width: 900px) { .mlist { grid-template-columns: 1fr 1fr; } }
    .match {
      width: 100%; text-align: left; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card);
      padding: 12px 14px; display: block;
    }
    .match.next { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(228, 193, 115, .45); }
    .match.done { background: #FBF8EE; }
    .match:disabled { cursor: default; }
    .mhead { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .mno { font: 400 20px var(--disp); color: var(--pine); min-width: 40px; }
    .mstat { margin-left: auto; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--ivory-2); color: var(--muted); white-space: nowrap; }
    .mstat.next { background: var(--gold-l); color: var(--pine-deep); }
    .mstat.live { background: var(--warn-bg); color: var(--clay); }
    .mstat.done { background: var(--win-bg); color: var(--win); }
    .mteams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    .side { min-width: 0; }
    .side.r { text-align: right; }
    .side small { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .side b { display: block; font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
    .side.win b { color: var(--win); }
    .side.win b::after { content: " ✓"; }
    .side.lose b { color: var(--muted); font-weight: 500; }
    .side.tbd b { color: var(--muted); font-weight: 500; font-style: italic; }
    .vs { font: 400 20px var(--disp); color: var(--gold); text-align: center; min-width: 44px; }
    .vs.score { color: var(--ink); font: 700 22px var(--body); font-variant-numeric: tabular-nums; }
    .ko-h { font: 400 22px var(--disp); color: var(--pine); margin: 24px 0 10px; }
    .byes { margin-top: 14px; font-size: 14px; color: var(--muted); }

    /* Standings */
    .tbl-wrap { overflow-x: auto; margin: 0 -4px; }
    table.st { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
    table.st th { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 4px; text-align: center; border-bottom: 1.5px solid var(--line); }
    table.st td { padding: 10px 4px; text-align: center; border-bottom: 1px solid var(--line); }
    table.st th.t, table.st td.t { text-align: left; }
    table.st td.t { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
    table.st td.pts { font-weight: 700; font-size: 17px; }
    table.st tr.q td { background: var(--win-bg); }
    table.st tr.q td:first-child { box-shadow: inset 4px 0 0 var(--win); }
    .flag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--clay); background: var(--warn-bg); border-radius: 6px; padding: 1px 6px; margin-left: 4px; vertical-align: middle; }
    .gstatus { font-size: 14px; color: var(--muted); }
    .repull { margin-top: 12px; }
    .champion { background: var(--pine); color: var(--on-dark); border-radius: 14px; padding: 18px; text-align: center; margin-bottom: 14px; }
    .champion .eyebrow { margin-bottom: 4px; }
    .champion b { font: 400 34px var(--disp); color: var(--gold-l); display: block; }
    .legend { font-size: 13px; color: var(--muted); }

    /* Result dialog: bottom sheet on phones */
    dialog {
      border: 0; padding: 0; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; margin: auto auto 0;
      background: var(--card); color: var(--ink); max-height: 92vh;
    }
    @media (min-width: 600px) { dialog { border-radius: 18px; margin: auto; } }
    dialog::backdrop { background: rgba(8, 42, 31, .55); }
    .dlg { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    .dlg-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .dlg-h .mno { font-size: 26px; }
    .dlg-teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 14px 0; }
    .dlg-teams .vs.score { font-size: 34px; }
    .pulls { display: grid; gap: 6px; margin: 10px 0 14px; }
    .pull { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 10px; background: var(--ivory-2); font-weight: 600; }
    .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pick .btn { min-height: 64px; font-size: 19px; overflow-wrap: anywhere; }
    .dlg-foot { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .dlg-foot .btn { flex: 1 1 40%; padding: 0 10px; font-size: 15px; }
    .dlg-foot .btn.primary { flex-basis: 100%; }

    .toast {
      position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 50; max-width: calc(100% - 32px);
      background: var(--pine-deep); color: var(--on-dark); padding: 12px 18px; border-radius: 12px; font-weight: 600;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    footer.foot { color: var(--muted); font-size: 13px; padding: 12px 0 0; }


    .toprow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .appnav { display: flex; background: var(--pine-deep); border-radius: 10px; padding: 3px; gap: 3px; }
    .appnav a { min-height: 36px; padding: 0 14px; border-radius: 8px; display: inline-flex; align-items: center;
                font-size: 14px; font-weight: 700; color: var(--on-dark-2); text-decoration: none; }
    .appnav a[aria-current="page"] { background: var(--gold-l); color: var(--pine-deep); }
    .appnav a:not([aria-current]):hover { color: var(--on-dark); background: var(--pine-mid); }
    #print { display: none; }

    @media print {
      @page { size: A4; margin: 12mm; }
      body { background: #fff; color: #000; font: 11pt/1.35 var(--body); }
      body > *:not(#print) { display: none !important; }
      #print { display: block; }
      #print * { color: #000 !important; background: transparent !important; box-shadow: none !important; }
      .pcat + .pcat { break-before: page; }
      .pcat h1 { font: 400 20pt var(--disp); margin: 0 0 2mm; }
      .pcat h2 { font: 700 13pt var(--body); margin: 6mm 0 2mm; }
      .pcat p { margin: 0 0 2mm; }
      .pcat table { width: 100%; border-collapse: collapse; margin-bottom: 3mm; break-inside: auto; }
      .pcat tr { break-inside: avoid; }
      .pcat th, .pcat td { border: 0.6pt solid #000; padding: 1.6mm 2mm; text-align: left; font-variant-numeric: tabular-nums; }
      .pcat th { font-weight: 700; }
      .pcat td.c, .pcat th.c { text-align: center; }
      .pcat .blank { min-width: 18mm; }
      .pgroups { display: flex; gap: 6mm; }
      .pgroups > div { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="toprow"><p class="eyebrow">Onaaravam ’26 · Organiser</p><nav class="appnav" aria-label="Organiser tools"><a href="fixtures.html" aria-current="page">Fixtures</a><a href="weigh-in.html">Weigh-in</a></nav></div>
      <h1>Vadamvali fixtures <span class="mal" lang="ml">വടംവലി</span></h1>
      <div class="seg" id="cats" role="group" aria-label="Category"></div>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main class="wrap" id="view" aria-live="polite"></main>
  <div id="print" aria-hidden="true"></div>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script>
  // ---------------------------------------------------------------------------
  // Pure logic: draw, round robin, scheduling, standings, knockout.
  // Kept free of the DOM so it can be tested outside the browser.
  // ---------------------------------------------------------------------------
  (function (G) {
    const CATS = { men: 'Men', women: 'Women', kids: 'Kids' };
    const letter = (i) => String.fromCharCode(65 + i);
    const need = (bo) => Math.floor(bo / 2) + 1;

    function newCat(towers = 6) {
      return {
        towers, teams: Array.from({ length: towers }, (_, i) => 'T' + (i + 1)),
        mode: 'count', groupCount: 2, groupSize: 4,
        bestOf: 3, koBestOf: 3, points: 2, ko: 'final',
        seed: null, manual: false, groups: null, matches: [], byes: [], results: {}, repulls: {},
      };
    }

    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function shuffle(arr, rng) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function cleanTeams(teams) {
      return teams.map((t) => String(t).trim()).filter(Boolean);
    }

    function teamProblems(teams) {
      const list = cleanTeams(teams);
      const seen = new Set(), dup = new Set();
      list.forEach((t) => { const k = t.toLowerCase(); if (seen.has(k)) dup.add(t); seen.add(k); });
      const out = [];
      if (list.length < 2) out.push('Add at least two teams.');
      if (dup.size) out.push('Team names must be different: ' + [...dup].join(', ') + '.');
      return out;
    }

    function groupCountFor(c, n) {
      return c.mode === 'size' ? Math.max(1, Math.ceil(n / Math.max(2, c.groupSize | 0))) : Math.max(1, c.groupCount | 0);
    }

    function groupSizes(n, k) {
      const base = Math.floor(n / k), extra = n % k;
      return Array.from({ length: k }, (_, i) => base + (i < extra ? 1 : 0));
    }

    // Shuffle with the seed, then deal like cards so sizes differ by at most one.
    function draw(teams, k, seed) {
      const order = shuffle(cleanTeams(teams), mulberry32(seed));
      const groups = Array.from({ length: k }, () => []);
      order.forEach((t, i) => groups[i % k].push(t));
      return groups;
    }

    // Circle method: fix the first team, rotate the rest. Odd counts get a bye slot.
    function roundRobin(list) {
      const arr = list.slice();
      if (arr.length % 2) arr.push(null);
      const n = arr.length, rounds = [], byes = [];
      for (let r = 0; r < n - 1; r++) {
        const pairs = [];
        let bye = null;
        for (let i = 0; i < n / 2; i++) {
          const a = arr[i], b = arr[n - 1 - i];
          if (a === null) bye = b; else if (b === null) bye = a; else pairs.push([a, b]);
        }
        rounds.push(pairs); byes.push(bye);
        arr.splice(1, 0, arr.pop());
      }
      return { rounds, byes };
    }

    const shares = (m, o) => m.a === o.a || m.a === o.b || m.b === o.a || m.b === o.b;

    // Interleave the groups' round robins so no team pulls twice in a row where it can be
    // avoided. Greedy picks with seeded noise, many restarts, keep the cheapest order.
    function schedule(groups, seed) {
      const rng = mulberry32((seed ^ 0x9E3779B9) >>> 0);
      const pool = [], byes = [];
      groups.forEach((g, gi) => {
        const rr = roundRobin(g);
        rr.rounds.forEach((ps, ri) => ps.forEach(([a, b]) => pool.push({ g: gi, r: ri, a, b })));
        byes.push(rr.byes);
      });
      let best = null;
      for (let t = 0; t < 400; t++) {
        const rem = pool.slice(), seq = [];
        let cost = 0;
        while (rem.length) {
          const minR = {};
          rem.forEach((m) => { minR[m.g] = Math.min(minR[m.g] ?? Infinity, m.r); });
          const last = seq[seq.length - 1], prev = seq[seq.length - 2];
          let bi = 0, bs = Infinity, bc = 0;
          rem.forEach((m, i) => {
            const c = (last && shares(m, last) ? 1000 : 0) + (m.r - minR[m.g]) * 20 + (prev && shares(m, prev) ? 5 : 0);
            const s = c + (last && last.g === m.g ? 2 : 0) + rng() * 3;
            if (s < bs) { bs = s; bi = i; bc = c; }
          });
          seq.push(rem.splice(bi, 1)[0]);
          cost += bc;
        }
        if (!best || cost < best.cost) best = { seq, cost };
      }
      // Balance ends: whoever has started on the left less often takes the left.
      const left = {}, right = {};

      }
      if (koMs.length && (f === 'all' || f === 'todo' || f === 'ko')) {
        const list = koMs.filter((m) => f !== 'todo' || keep(m));
        if (list.length) html += `<h3 class="ko-h">Knockout</h3><div class="mlist">${list.map((m) => matchCard(c, m, nx && nx.id === m.id)).join('')}</div>`;
      }
      return html;
    }

    function vTable(c) {
      if (!c.groups) return `<h2 class="sec">Table</h2><p class="lede">No draw yet for ${CATS[S.cat]}.</p>
        <button class="btn primary block" data-act="view" data-view="groups">Draw the groups</button>`;
      const ko = knockout(c), q = c.ko === 'final' ? 1 : (c.groups.length === 1 ? 4 : 2);
      let html = `<h2 class="sec">Table</h2><p class="lede">${c.points} points a win. Ties: head-to-head, then pull difference, then a re-pull.</p>`;
      const fin = ko.matches.find((m) => m.id === 'F');
      const fs = fin && fin.l && fin.rt ? score(c, fin, c.koBestOf) : null;
      if (fs && fs.winner) {
        const third = ko.matches.find((m) => m.id === '3P');
        const ts = third && third.l && third.rt ? score(c, third, c.koBestOf) : null;
        html += `<div class="champion"><p class="eyebrow">${CATS[S.cat]}’s champion</p><b>${esc(fs.winner)}</b>
          <span>Runner-up ${esc(fs.loser)}${ts && ts.winner ? ` · Third ${esc(ts.winner)}` : ''}</span></div>`;
      }
      html += `<div class="grid ${c.groups.length > 1 ? 'two' : ''}">` + c.groups.map((_, gi) => {
        const st = standings(c, gi);
        const ties = [...new Set(st.rows.filter((r) => r.tie).map((r) => r.tie))];
        const body = st.rows.map((r, i) => `<tr class="${st.complete && i < q && !r.tie ? 'q' : ''}">
            <td>${i + 1}</td><td class="t">${esc(r.t)}${r.tie ? '<span class="flag">Re-pull</span>' : ''}${r.repulled ? '<span class="flag">R</span>' : ''}</td>
            <td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.pf}</td><td>${r.pa}</td><td>${r.pd > 0 ? '+' : ''}${r.pd}</td><td class="pts">${r.pts}</td></tr>`).join('');
        let tieHtml = ties.map((key) => {
          const names = key.split('|').slice(1), picked = rpSel[key] || [];
          return `<div class="note warn repull">${ICON.info}<div><b>${names.map(esc).join(', ')}</b> are level on points, head-to-head and pull difference. Hold a re-pull, then tap the teams in finishing order.
            <div class="chips" style="margin-top:10px">${names.map((t) => {
              const at = picked.indexOf(t);
              return `<button class="chip" data-act="rpPick" data-key="${esc(key)}" data-team="${esc(t)}" aria-pressed="${at >= 0}" ${koStarted(c) ? 'disabled' : ''}>${at >= 0 ? at + 1 + '. ' : ''}${esc(t)}</button>`;
            }).join('')}</div></div></div>`;
        }).join('');
        const decided = Object.keys(c.repulls).filter((k) => k.startsWith(gi + '|'));
        if (decided.length && !koStarted(c)) tieHtml += `<button class="btn danger block" data-act="rpClear" data-g="${gi}" style="margin-top:10px">Clear re-pull result</button>`;
        return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px">
            <h3 style="margin:0">${gName(gi)}</h3><span class="gstatus">${st.complete ? 'Complete' : `${st.played} of ${st.total} played`}</span></div>
          <div class="tbl-wrap"><table class="st"><thead><tr><th>#</th><th class="t">Team</th><th title="Played">P</th><th title="Won">W</th><th title="Lost">L</th>
            <th title="Pulls won">PW</th><th title="Pulls lost">PL</th><th title="Pull difference">±</th><th title="Points">Pts</th></tr></thead><tbody>${body}</tbody></table></div>
          ${tieHtml}</div>`;
      }).join('') + `</div>`;
      html += `<p class="legend">P played · W won · L lost · PW / PL pulls won / lost · ± pull difference · Green rows go through${c.groups.some((_, gi) => Object.keys(c.repulls).some((k) => k.startsWith(gi + '|'))) ? ' · R placed by re-pull' : ''}.</p>`;

      html += `<h3 class="ko-h">Knockout</h3><div class="card">
        <p>${c.groups.length === 2 ? 'The two group champions, A1 and B1, meet directly in the Grand Final. No semi-finals.' : 'With one group, 1st and 2nd meet in the Grand Final.'}</p>
        ${ko.err ? `<p class="err" style="margin-top:10px">${esc(ko.err)}</p>` : ''}
      </div>`;
      if (ko.matches.length) {
        html += `<div class="mlist">${ko.matches.map((m) => matchCard(c, { ...m, bo: c.koBestOf }, false)).join('')}</div>`;
      }
      return html;
    }

    function vData(c) {
      const lk = locked(c), ks = koStarted(c);
      const bo = (key, v, dis) => `<button data-act="bo" data-k="${key}" data-v="${v}" aria-pressed="${c[key] === v}" ${dis ? 'disabled' : ''}>Best of ${v}</button>`;
      return `<h2 class="sec">Settings &amp; data</h2><p class="lede">Settings apply to ${CATS[S.cat]}.</p>
        <div class="card"><h3>Match format</h3>
          <div class="stack">
            <div class="field">Group matches<div class="seg-l">${bo('bestOf', 3, lk)}${bo('bestOf', 5, lk)}</div></div>
            <div class="field">Knockout matches<div class="seg-l">${bo('koBestOf', 3, ks)}${bo('koBestOf', 5, ks)}</div></div>
            <label class="field">Points for a win<input type="number" class="num" data-change="points" min="1" max="10" value="${c.points}" inputmode="numeric" ${lk ? 'disabled' : ''}></label>
          </div>
          ${lk ? '<p class="small muted" style="margin-top:10px">Group settings are locked once a result is in.</p>' : ''}
        </div>
        <div class="card"><h3>Hand over to another phone</h3>
          <p class="small muted" style="margin-bottom:12px">Exports every category — teams, draws, results. Importing replaces everything on this phone.</p>
          <div class="stack">
            ${navigator.canShare ? '<button class="btn primary block" data-act="share">Share file…</button>' : ''}
            <button class="btn block ${navigator.canShare ? '' : 'primary'}" data-act="export">Download JSON</button>
            <button class="btn block" data-act="copy">Copy JSON</button>
            <label class="btn block" style="cursor:pointer">Import JSON file<input type="file" accept=".json,application/json" data-change="importFile" hidden></label>
          </div>
          <details style="margin-top:8px"><summary>Paste JSON instead</summary>
            <textarea id="pasteJson" placeholder='{"v":1, …}'></textarea>
            <button class="btn block" data-act="loadPaste" style="margin-top:10px">Load pasted JSON</button>
          </details>
        </div>
        <div class="card"><h3>Print</h3>
          <p class="small muted" style="margin-bottom:12px">Fixtures and tables for every drawn category, black and white on A4.</p>
          <button class="btn block" data-act="print">Print</button>
        </div>
        <div class="card"><h3>Reset</h3>
          <p class="small muted" style="margin-bottom:12px">Reset ${CATS[S.cat]} clears its draw and results but keeps the team names.</p>
          <div class="stack">
            <button class="btn danger block" data-act="reset" ${c.groups ? '' : 'disabled'}>Reset ${CATS[S.cat]}</button>
            <button class="btn danger block" data-act="resetAll">Reset all fixtures</button>
            <button class="btn danger block" data-act="clearAllData">Clear all data (fixtures and weigh-in)</button>
          </div>
        </div>`;
    }

    // ---------------------------------------------------------------- print
    function renderPrint() {
      const out = Object.keys(CATS).filter((k) => S.cats[k].groups).map((k) => {
        const c = S.cats[k], all = allMatches(c);
        const res = (m) => {
          if (!m.l || !m.rt) return '';
          const s = score(c, m, m.bo);
          return s.winner ? `${esc(s.winner)} ${Math.max(s.l, s.rt)}–${Math.min(s.l, s.rt)}${s.wo ? ' (w/o)' : ''}` : s.started ? `${s.l}–${s.rt}` : '';
        };
        const groups = c.groups.map((g, gi) => `<div><b>${gName(gi)}:</b> ${g.map(esc).join(', ')}</div>`).join('');
        const rows = all.map((m) => `<tr><td>${m.no}</td><td>${m.ko ? esc(m.name) : `${letter(m.g)} · R${m.r + 1}`}</td>
          <td>${esc(m.l || m.lLabel)}</td><td>${esc(m.rt || m.rLabel)}</td><td class="blank">${res(m)}</td></tr>`).join('');
        const tables = c.groups.map((_, gi) => {
          const st = standings(c, gi);
          return `<div><h2>${gName(gi)}${st.complete ? '' : ` (${st.played}/${st.total} played)`}</h2><table><thead><tr><th>#</th><th>Team</th><th class="c">P</th><th class="c">W</th><th class="c">L</th><th class="c">PW</th><th class="c">PL</th><th class="c">±</th><th class="c">Pts</th></tr></thead><tbody>
            ${st.rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.t)}${r.tie ? ' *' : ''}</td><td class="c">${r.p}</td><td class="c">${r.w}</td><td class="c">${r.l}</td><td class="c">${r.pf}</td><td class="c">${r.pa}</td><td class="c">${r.pd}</td><td class="c">${r.pts}</td></tr>`).join('')}</tbody></table></div>`;
        }).join('');
        return `<section class="pcat"><h1>Vadamvali — ${CATS[k]}</h1>
          <p>Onaaravam ’26 · seed ${c.seed}${c.manual ? ' (adjusted by hand)' : ''} · group matches best of ${c.bestOf}, knockout best of ${c.koBestOf} · ${c.points} points a win · printed ${new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}</p>
          ${groups}<h2>Fixtures</h2><table><thead><tr><th>No</th><th>Stage</th><th>Left</th><th>Right</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table>
          <div class="pgroups">${tables}</div><p>Ties: head-to-head, then pull difference, then re-pull (* = re-pull needed).</p></section>`;
      }).join('');
      $('#print').innerHTML = out || '<p>No draws yet.</p>';
    }

    // ---------------------------------------------------------------- result dialog
    function openDlg(id) { dlgId = id; renderDlg(); const d = $('#dlg'); if (!d.open) d.showModal(); }
    function renderDlg() {
      const c = cat(), m = allMatches(c).find((x) => x.id === dlgId);
      if (!m || !m.l || !m.rt) { $('#dlg').close(); return; }
      const s = score(c, m, m.bo), k = need(m.bo);
      const deps = (KO_DEPS[m.id] || []).filter((d) => c.results[d] && c.results[d].pulls.length);
      const why = !m.ko && koStarted(c) ? 'The knockout has started, so group results are fixed. Clear the knockout results first.'
        : deps.length ? 'A later knockout match already has a result. Clear it first.' : '';
      const where = m.ko ? m.name : `${gName(m.g)} · Round ${m.r + 1}`;
      const side = (t, r) => `<div class="side ${r ? 'r' : ''} ${s.winner ? (s.winner === t ? 'win' : 'lose') : ''}"><small>${r ? 'Right' : 'Left'}</small><b>${esc(t)}</b></div>`;
      let status = s.winner ? `<b>${esc(s.winner)}</b> win ${Math.max(s.l, s.rt)}–${Math.min(s.l, s.rt)}${s.wo ? ' by walkover / disqualification' : ''}.`
        : s.started ? `Pull ${s.pulls.length + 1} next. First to ${k} wins.` : `Best of ${m.bo}: first to ${k} pulls wins.`;
      let body = '';
      if (!why && !s.winner) {
        body += `<p class="small muted" style="margin-bottom:8px">Who won pull ${s.pulls.length + 1}?</p>
          <div class="pick"><button class="btn primary" data-act="pull" data-team="${esc(m.l)}">${esc(m.l)}</button>
          <button class="btn primary" data-act="pull" data-team="${esc(m.rt)}">${esc(m.rt)}</button></div>`;
      }
      const pulls = s.pulls.length && !s.wo ? `<div class="pulls">${s.pulls.map((p, i) => `<div class="pull"><span>Pull ${i + 1}</span><span>${esc(p)}</span></div>`).join('')}</div>` : '';
      let foot = '';
      if (!why) {
        if (s.pulls.length && !s.wo) foot += `<button class="btn" data-act="undo">Undo last pull</button>`;
        if (s.pulls.length) foot += `<button class="btn danger" data-act="clearRes">Clear result</button>`;
      }
      const wo = !why && !s.winner ? `<details style="margin-top:10px"><summary>Walkover or disqualification</summary>
          <p class="small muted" style="margin-bottom:8px">Awards the match ${k}–0.</p>
          <div class="pick"><button class="btn" data-act="wo" data-team="${esc(m.l)}">${esc(m.l)} wins</button><button class="btn" data-act="wo" data-team="${esc(m.rt)}">${esc(m.rt)} wins</button></div>
        </details>` : '';
      $('#dlg').innerHTML = `<div class="dlg">
        <div class="dlg-h"><span class="mno" id="dlg-title">${m.no}</span><span class="muted">${where}</span></div>
        <div class="dlg-teams">${side(m.l, false)}<span class="vs score">${s.l}–${s.rt}</span>${side(m.rt, true)}</div>
        <p style="margin-bottom:12px">${status}</p>
        ${why ? `<div class="note info">${ICON.info}<span>${why}</span></div>` : ''}
        ${pulls}${body}${wo}
        <div class="dlg-foot">${foot}<button class="btn primary" data-act="closeDlg">${s.winner || why ? 'Done' : 'Close'}</button></div>
      </div>`;
    }
    function setPulls(pulls, wo) {
      const c = cat();
      if (pulls.length) c.results[dlgId] = { pulls, wo: !!wo }; else delete c.results[dlgId];
      save(); renderDlg(); render();
    }

    // ---------------------------------------------------------------- actions
    const act = {
      cat(b) { S.cat = b.dataset.cat; sel = null; S.filter = 'all'; save(); render(); },
      view(b) { S.view = b.dataset.view; sel = null; save(); render(); window.scrollTo(0, 0); },
      fill() {
        const c = cat(), n = Math.min(40, Math.max(2, parseInt($('#towers').value, 10) || c.towers));
        const list = Array.from({ length: n }, (_, i) => 'T' + (i + 1));
        if (cleanTeams(c.teams).join() !== list.join() && cleanTeams(c.teams).length && !confirm(`Replace the team list with T1 – T${n}?`)) return;
        c.towers = n; c.teams = list; save(); render();
      },
      addTeam() { cat().teams.push(''); save(); render(); const ins = document.querySelectorAll('[data-team]'); ins[ins.length - 1].focus(); },
      rmTeam(b) { cat().teams.splice(+b.dataset.i, 1); save(); render(); },
      applyPaste() { cat().teams = cleanTeams($('#paste').value.split('\n')); save(); render(); toast('Team list updated.'); },
      changeTeams() {
        if (!confirm('Change teams? This clears the current draw and fixtures for ' + CATS[S.cat] + '.')) return;
        clearDraw(cat()); save(); render();
      },
      mode(b) { cat().mode = b.dataset.v; save(); render(); },
      step(b) {
        const c = cat(), key = c.mode === 'size' ? 'groupSize' : 'groupCount', min = c.mode === 'size' ? 2 : 1;
        c[key] = Math.min(20, Math.max(min, (c[key] | 0) + +b.dataset.d)); save(); render();
      },
      draw() {
        const c = cat();
        if (c.groups && !confirm('Redraw? The current groups and fixtures will be replaced.')) return;
        doDraw(newSeed());
      },
      drawSeed() {
        const v = parseInt($('#seedIn').value, 10);
        if (!Number.isFinite(v) || v < 0) { toast('Enter the seed number.'); return; }
        if (cat().groups && !confirm('Replace the current draw with seed ' + v + '?')) return;
        doDraw(v);
      },
      pick(b) { const t = b.dataset.team; sel = sel === t ? null : t; render(); },
      moveTo(b) { moveTeam(sel, +b.dataset.g); },
      open(b) { openDlg(b.dataset.id); },
      pull(b) {
        const c = cat(), r = c.results[dlgId];
        const m = allMatches(c).find((x) => x.id === dlgId);
        const first = !locked(c) && !m.ko;
        setPulls((r ? r.pulls : []).concat(b.dataset.team));
        if (first) toast('First result in — fixtures are now locked.');
      },
      undo() { const r = cat().results[dlgId]; setPulls(r ? r.pulls.slice(0, -1) : []); },
      clearRes() { if (confirm('Clear this match’s result?')) setPulls([]); },
      wo(b) {
        const m = allMatches(cat()).find((x) => x.id === dlgId);
        if (confirm(`Award ${m.no} to ${b.dataset.team} by walkover / disqualification?`)) setPulls(Array(need(m.bo)).fill(b.dataset.team), true);
      },
      closeDlg() { $('#dlg').close(); },
      filter(b) { S.filter = b.dataset.f; save(); render(); },
      rpPick(b) {
        const c = cat(), key = b.dataset.key, t = b.dataset.team, names = key.split('|').slice(1);
        const cur = rpSel[key] || [];
        rpSel[key] = cur.includes(t) ? cur.filter((x) => x !== t) : cur.concat(t);
        if (rpSel[key].length === names.length - 1) rpSel[key].push(names.find((n) => !rpSel[key].includes(n)));
        if (rpSel[key].length === names.length) {
          c.repulls[key] = rpSel[key]; delete rpSel[key]; save(); toast('Re-pull recorded.');
        }
        render();
      },
      rpClear(b) {
        const c = cat(), g = b.dataset.g;
        if (!confirm('Clear the re-pull result for ' + gName(+g) + '?')) return;
        Object.keys(c.repulls).filter((k) => k.startsWith(g + '|')).forEach((k) => delete c.repulls[k]);
        save(); render();
      },
      bo(b) { cat()[b.dataset.k] = +b.dataset.v; save(); render(); },
      export() {
        const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = fileName(); a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      },
      async share() {
        const file = new File([JSON.stringify(S)], fileName(), { type: 'application/json' });
        try {
          if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'Vadamvali fixtures' });
          else act.export();
        } catch (e) { if (e.name !== 'AbortError') act.export(); }
      },
      async copy() {
        try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Copied. Paste it on the other phone under Data.'); }
        catch (e) { toast('Copy failed — use Download instead.'); }
      },
      loadPaste() { importText($('#pasteJson').value); },
      print() { renderPrint(); window.print(); },
      reset() {
        if (!confirm(`Reset ${CATS[S.cat]}? This deletes its draw, fixtures and every result. Team names are kept.`)) return;
        clearDraw(cat()); save(); render(); toast(CATS[S.cat] + ' reset.');
      },
      clearAllData() {
        if (!confirm('Clear ALL data on this phone?\n\nThis deletes the fixtures (every category, draw and result) AND the weigh-in (every team, weight and clearance). It cannot be undone — export first if you need a copy.')) return;
        try { ['onaaravam26-vadamvali-fixtures', 'onaaravam26-vadamvali-weighin'].forEach((k) => localStorage.removeItem(k)); } catch (e) { /* ignore */ }
        location.reload();
      },
      resetAll() {
        if (!confirm('Reset all fixtures? Every category’s draw and results on this phone will be deleted. The weigh-in is not touched.')) return;
        S = fresh(); S.view = 'data'; save(); render(); toast('Everything reset.');
      },
    };
    const fileName = () => 'vadamvali-fixtures-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.json';

    function importText(text) {
      let next;
      try { next = normalise(JSON.parse(text)); } catch (e) { toast('Import failed: ' + (e.message || 'not valid JSON')); return; }
      if (!confirm('Replace everything on this phone with the imported file?')) return;
      S = next; sel = null; rpSel = {}; save(); render(); toast('Imported.');
    }

    function moveTeam(t, gi) {
      const c = cat();
      if (!t || locked(c)) return;
      const from = c.groups.findIndex((g) => g.includes(t));
      if (from < 0 || from === gi) return;
      if (c.groups[from].length <= 2) { toast('A group needs at least two teams.'); return; }
      c.groups[from] = c.groups[from].filter((x) => x !== t);
      c.groups[gi].push(t);
      c.manual = true; sel = null;
      regen(c); save(); render();
      toast(`${t} moved to ${gName(gi)}. Fixtures updated.`);
    }

    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      act[b.dataset.act](b);
    });
    document.addEventListener('input', (e) => {
      const el = e.target;
      if (el.dataset.team !== undefined && el.tagName === 'INPUT') {
        cat().teams[+el.dataset.team] = el.value; save();
        const err = $('#teamErr'); if (err) err.textContent = teamProblems(cat().teams).join(' ');
      }
      if (el.id === 'towers') { const n = $('#towersN'); if (n) n.textContent = el.value; }
    });
    document.addEventListener('change', (e) => {
      const el = e.target, c = cat();
      if (el.id === 'gnum') {
        const key = c.mode === 'size' ? 'groupSize' : 'groupCount';
        c[key] = Math.min(20, Math.max(c.mode === 'size' ? 2 : 1, parseInt(el.value, 10) || c[key])); save(); render();
      } else if (el.dataset.team !== undefined && el.tagName === 'INPUT') {
        render();
      } else if (el.dataset.change === 'ko') { c.ko = el.value; save(); render(); }
      else if (el.dataset.change === 'points') { c.points = Math.min(10, Math.max(1, parseInt(el.value, 10) || 2)); save(); render(); }
      else if (el.dataset.change === 'importFile' && el.files[0]) { el.files[0].text().then(importText); el.value = ''; }
    });

    // Drag and drop between groups (desktop); tap-to-move covers phones.
    document.addEventListener('dragstart', (e) => {
      const chip = e.target.closest && e.target.closest('.chip[data-team]');
      if (chip) { e.dataTransfer.setData('text/plain', chip.dataset.team); e.dataTransfer.effectAllowed = 'move'; }
    });
    document.addEventListener('dragover', (e) => {
      const g = e.target.closest && e.target.closest('.gcard');
      if (g && !locked(cat())) { e.preventDefault(); document.querySelectorAll('.gcard.drop').forEach((x) => x !== g && x.classList.remove('drop')); g.classList.add('drop'); }
    });
    document.addEventListener('dragleave', (e) => { const g = e.target.closest && e.target.closest('.gcard'); if (g && !g.contains(e.relatedTarget)) g.classList.remove('drop'); });
    document.addEventListener('drop', (e) => {
      const g = e.target.closest && e.target.closest('.gcard');
      if (!g) return;
      e.preventDefault(); g.classList.remove('drop');
      moveTeam(e.dataTransfer.getData('text/plain'), +g.dataset.group);
    });

    $('#dlg').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
    window.addEventListener('beforeprint', renderPrint);
    window.addEventListener('storage', (e) => { if (e.key === KEY) { S = load(); render(); } });

    render();
  })();
